<style>
  :root {
    --navy-bg: #010a14;
    --navy-panel: rgba(4, 25, 48, 0.6);
    --navy-raised: rgba(10, 46, 82, 0.85);
    --gold: #E3C776;
    --gold-hover: #f5da8c;
    --gold-dim: rgba(227, 199, 118, 0.3);
    --line: rgba(227, 199, 118, 0.15);
    --text-main: #F5F1E6;
    --text-muted: #8fa2b8;
    --glow: 0 0 20px rgba(227, 199, 118, 0.15);
  }
  
  body { 
    font-family: 'Inter', sans-serif; 
    background: radial-gradient(circle at top right, #041f3d 0%, var(--navy-bg) 60%); 
    color: var(--text-main); 
    min-height: 100vh;
    background-attachment: fixed;
  }
  
  .font-display { font-family: 'Cormorant Garamond', serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  
  /* Glassmorphism Panels */
  .panel { 
    background: var(--navy-panel); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); 
    border-radius: 16px; 
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .panel-raised { background: var(--navy-raised); border: 1px solid var(--gold-dim); border-radius: 16px; }
  
  .gold-text { color: var(--gold); }
  .gold-bg { background: var(--gold); color: #000; box-shadow: 0 4px 14px rgba(227, 199, 118, 0.2); }
  .gold-bg:hover { background: var(--gold-hover); transform: translateY(-1px); box-shadow: var(--glow); }
  
  .btn { 
    font-size: .75rem; 
    font-weight: 700; 
    letter-spacing: .05em; 
    padding: .6rem 1.2rem; 
    border-radius: 10px; 
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    text-transform: uppercase;
  }
  .btn:active { transform: translateY(1px); }
  
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--gold); }
  .btn-ghost:hover { border-color: var(--gold); background: rgba(227, 199, 118, 0.05); }
  
  .input { 
    background: rgba(0, 0, 0, 0.2); 
    border: 1px solid var(--line); 
    border-radius: 10px; 
    padding: .65rem 1rem; 
    font-size: .85rem; 
    color: var(--text-main); 
    width: 100%; 
    transition: all 0.2s ease;
  }
  .input:focus { outline: none; border-color: var(--gold); background: rgba(0, 0, 0, 0.4); box-shadow: inset 0 0 0 1px var(--gold-dim); }
  .input::placeholder { color: rgba(143, 162, 184, 0.5); }
  
  .tab-pill { 
    font-size: .75rem; 
    font-weight: 600; 
    letter-spacing: .03em; 
    padding: .5rem 1.25rem; 
    border-radius: 999px; 
    color: var(--text-muted); 
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }
  .tab-pill:hover { color: var(--gold); background: rgba(227, 199, 118, 0.05); }
  .tab-pill.active { background: var(--gold); color: #000; font-weight: 700; box-shadow: var(--glow); }
  
  .divider { border-color: var(--line); }
  
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
  
  .badge { font-size: .65rem; font-weight: 700; letter-spacing: .05em; padding: .25rem .6rem; border-radius: 999px; text-transform: uppercase; }
  
  .hidden { display: none !important; }
  
  .trend-up { color: #7fd8a6; text-shadow: 0 0 10px rgba(127, 216, 166, 0.3); }
  .trend-down { color: #e08a8a; text-shadow: 0 0 10px rgba(224, 138, 138, 0.3); }
  
  /* Animations */
  .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(8px); } 
    to { opacity: 1; transform: translateY(0); } 
  }

  .stagger-1 { animation-delay: 0.1s; opacity: 0; }
  .stagger-2 { animation-delay: 0.2s; opacity: 0; }
  .stagger-3 { animation-delay: 0.3s; opacity: 0; }

  /* Table Row Hover */
  tbody tr { transition: background-color 0.2s ease; }
  tbody tr:hover { background-color: rgba(227, 199, 118, 0.03); }

  #receiptFrame { background: #fff; color: #111; }

  /* Goal Progress Bars */
  .progress-track { background: rgba(0,0,0,0.3); border-radius: 999px; height: 8px; }
  .progress-fill { border-radius: 999px; height: 100%; transition: width 0.5s ease; }

  /* Alert Item */
  .alert-item {
    border-left: 3px solid transparent;
    background: rgba(0,0,0,0.2);
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 0.75rem;
  }

  @media print {
    body { background: #fff !important; }
    body > *:not(#receiptModal) { display: none !important; }
    #receiptModal {
      display: flex !important;
      position: static !important;
      background: #fff !important;
      inset: auto !important;
      padding: 0 !important;
    }
    #receiptModal .no-print { display: none !important; }
    #receiptFrame { overflow: visible !important; max-height: none !important; }
  }
  .alert-item.warning { border-left-color: #e08a8a; }
  .alert-item.info { border-left-color: #8fb8e0; }
  .alert-item.success { border-left-color: #7fd8a6; }

  /* Sync Status Indicator */
  #syncStatus {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  #syncStatus .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7fd8a6;
    box-shadow: 0 0 8px rgba(127,216,166,0.6);
  }
</style>

<script>
/* ==========================================================
   EMPIRE DIGITAL UNITY — TEAM CRM (Enhanced + Bug Fix)
   ========================================================== */

const USERS = [
  { id: "enockson", name: "Enockson L.C.", code: "3456", role: "admin",  canViewBilling: true  },
  { id: "folkenberg",    name: "Folkenberg Charles", code: "3202", role: "member", canViewBilling: false },
  { id: "philippe", name: "Jean Philippe D.", code: "3456", role: "founder", canViewBilling: true  },
];

let currentUser = null;
let selectedNameId = null;
let currentClientId = null;
let currentClientTab = "overview";
let metricRange = "daily";
let metricFocus = "all"; 
let platformFocus = "all"; 
let calendarYear = new Date().getFullYear();
let calendarMonth = new Date().getMonth();
const PLATFORMS = ["TikTok","Facebook","Instagram","X","YouTube","Other"];

function defaultState(){
  return { clients: [], notes: [], worklogs: [], deliverables: [], payments: [], metrics: [], activity: [], paymentHistory: [], goals: [] };
}

// --- CRITICAL FIX: merge missing fields with defaults ---
function normalizeState(raw){
  const d = defaultState();
  if (!raw) return d;
  return {
    ...d,
    ...raw,
    // Ensure arrays exist even if missing from older state
    clients: Array.isArray(raw.clients) ? raw.clients : [],
    notes: Array.isArray(raw.notes) ? raw.notes : [],
    worklogs: Array.isArray(raw.worklogs) ? raw.worklogs : [],
    deliverables: Array.isArray(raw.deliverables) ? raw.deliverables : [],
    payments: Array.isArray(raw.payments) ? raw.payments : [],
    metrics: Array.isArray(raw.metrics) ? raw.metrics : [],
    activity: Array.isArray(raw.activity) ? raw.activity : [],
    paymentHistory: Array.isArray(raw.paymentHistory) ? raw.paymentHistory : [],
    goals: Array.isArray(raw.goals) ? raw.goals : []
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem("empire_crm_state");
    return normalizeState(raw ? JSON.parse(raw) : null);
  } catch(e){ return defaultState(); }
}
let isApplyingRemoteUpdate = false;
let saveTimeout = null;

function saveState(){
  localStorage.setItem("empire_crm_state", JSON.stringify(state));
  if (isApplyingRemoteUpdate) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    stateDocRef.set(state).catch(err => {
      console.error("Firestore save failed:", err);
      showToast("Sync error", "Couldn't sync to the team database.");
    });
  }, 300);
}

function refreshCurrentView(){
  if (!currentUser) return;
  const onClientDetail = !document.getElementById("clientDetailView").classList.contains("hidden");
  if (onClientDetail && currentClientId && getClient()){
    renderClientDetail();
  } else {
    renderLeaderboard();
    renderMyTasks();
    renderActivityFeed();
    renderDashboardCharts();
    renderAlerts();
  }
}

let state = loadState();

stateDocRef.onSnapshot((doc) => {
  if (doc.exists){
    isApplyingRemoteUpdate = true;
    state = normalizeState(doc.data());  // <-- normalize incoming data
    localStorage.setItem("empire_crm_state", JSON.stringify(state));
    refreshCurrentView();
    isApplyingRemoteUpdate = false;
  } else {
    stateDocRef.set(state).catch(err => console.error("Initial Firestore seed failed:", err));
  }
}, (err) => {
  console.error("Firestore listener error:", err);
  showToast("Sync error", "Working offline — team changes won't be visible until this is fixed.");
});

function logActivity(text){
  state.activity.unshift({ id: "A"+Date.now(), text, author: currentUser.name, ts: Date.now() });
  state.activity = state.activity.slice(0, 40);
  saveState();
}
function uid(prefix){ return prefix + "_" + Date.now() + Math.floor(Math.random()*999); }
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function money(n){
  const v = Number(n);
  return (Number.isFinite(v) ? v : 0).toFixed(2);
}
function localISODate(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseISODateLocal(iso){
  if (!iso) return new Date(NaN);
  const parts = String(iso).slice(0,10).split("-").map(Number);
  if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return new Date(iso);
  return new Date(parts[0], parts[1]-1, parts[2]);
}

// ---------------- LOGIN ----------------
function renderNameTiles(){
  const box = document.getElementById("nameTiles");
  box.innerHTML = "";
  USERS.forEach(u => {
    const tile = document.createElement("button");
    tile.className = "panel p-8 flex flex-col items-center justify-center gap-4 hover:border-[var(--gold)] transition group";
    tile.innerHTML = `
      <div class="w-16 h-16 rounded-full bg-[rgba(227,199,118,0.1)] group-hover:bg-[var(--gold)] group-hover:text-black group-hover:shadow-[var(--glow)] transition-all flex items-center justify-center font-display text-2xl font-bold gold-text border border-[var(--gold-dim)]">${u.name.charAt(0)}</div>
      <div class="text-[13px] font-bold tracking-wide">${u.name}</div>
      <div class="text-[10px] uppercase tracking-widest text-[var(--text-muted)]">${u.role}</div>`;
    tile.onclick = () => selectName(u.id);
    box.appendChild(tile);
  });
}
function selectName(id){
  selectedNameId = id;
  const u = USERS.find(x=>x.id===id);
  document.getElementById("selectedNameLabel").innerText = u.name;
  document.getElementById("selectedNameInitial").innerText = u.name.charAt(0);
  document.getElementById("codeEntry").classList.remove("hidden");
  document.getElementById("nameTiles").classList.add("hidden");
  document.getElementById("codeInput").value = "";
  document.getElementById("loginError").classList.add("hidden");
  document.getElementById("codeInput").focus();
}
function deselectName(){
  selectedNameId = null;
  document.getElementById("codeEntry").classList.add("hidden");
  document.getElementById("nameTiles").classList.remove("hidden");
}
function attemptLogin(){
  const u = USERS.find(x=>x.id===selectedNameId);
  const code = document.getElementById("codeInput").value;
  if (u && code === u.code){
    currentUser = u;
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
    document.getElementById("currentUserLabel").innerText = u.name;
    document.getElementById("headerAvatar").innerText = u.name.charAt(0);
    goToDashboard();
  } else {
    document.getElementById("loginError").classList.remove("hidden");
  }
}
function logout(){
  currentUser = null;
  document.getElementById("appShell").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  deselectName();
}
document.getElementById("codeInput")?.addEventListener?.("keydown", e => { if(e.key==="Enter") attemptLogin(); });

// ---------------- GROWTH SCORE ----------------
function computeGrowthScore(clientId){
  const now = Date.now();
  const day = 86400000;
  const recent = state.metrics.filter(m => m.clientId===clientId && now - m.ts <= 30*day);
  const prior  = state.metrics.filter(m => m.clientId===clientId && now - m.ts > 30*day && now - m.ts <= 60*day);
  function sum(arr, field){ return arr.reduce((a,b)=>a+(b[field]||0),0); }
  function pctChange(field){
    const r = sum(recent, field), p = sum(prior, field);
    if (p === 0) return r > 0 ? 100 : 0;
    return ((r - p) / p) * 100;
  }
  const vChange = pctChange("views");
  const eChange = pctChange("engagements");
  const dChange = pctChange("dms");
  const score = (vChange*0.30) + (eChange*0.40) + (dChange*0.30);
  return { score: Math.round(score*10)/10, vChange, eChange, dChange };
}

// Dashboard charts
let dashboardChart = null;
function renderDashboardCharts(){
  // Build overall growth trend: sum of views across all clients over time (last 30 days)
  const days = [];
  const viewsByDay = {};
  for(let i=0; i<30; i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
    days.unshift(key);
    viewsByDay[key] = 0;
  }
  state.metrics.forEach(m => {
    const d = new Date(m.ts);
    const key = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
    if(viewsByDay[key] !== undefined) viewsByDay[key] += m.views;
  });

  const canvas = document.getElementById('dashboardGrowthChart');
  if(!canvas) return;

  if(dashboardChart) dashboardChart.destroy();
  dashboardChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: days,
      datasets: [{
        label: 'Total Views',
        data: days.map(d=>viewsByDay[d]),
        borderColor: '#E3C776',
        backgroundColor: 'rgba(227, 199, 118, 0.1)',
        tension: 0.4,
        fill: true,
        pointRadius: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: { grid: { color: 'rgba(227,199,118,0.05)' } },
        y: { grid: { color: 'rgba(227,199,118,0.05)' }, beginAtZero: true }
      }
    }
  });
}

// Alerts system
function renderAlerts(){
  const el = document.getElementById('alertsBody');
  let alerts = [];

  // Low performance: client with negative growth score over 30 days
  state.clients.forEach(c => {
    const g = computeGrowthScore(c.id);
    if (g.score < 0) {
      alerts.push({
        type: 'warning',
        text: `${c.name} is trending down (${g.score}%)`,
        ts: Date.now()
      });
    }
  });

  // Overdue payments (due date passed)
  state.payments.forEach(p => {
    const c = state.clients.find(x=>x.id===p.clientId);
    if (c && p.dueDate && p.status !== 'Paid' && parseISODateLocal(p.dueDate) < new Date()) {
      alerts.push({
        type: 'info',
        text: `${c.name} payment overdue`,
        ts: Date.now()
      });
    }
  });

  // Deliverables in revision
  state.deliverables.forEach(d => {
    if (d.status === 'In Revision') {
      const c = state.clients.find(x=>x.id===d.clientId);
      alerts.push({
        type: 'info',
        text: `${d.name} for ${c?.name || 'client'} is in revision`,
        ts: Date.now()
      });
    }
  });

  if (alerts.length === 0) {
    el.innerHTML = `<div class="text-[var(--text-muted)] text-xs italic">All clear — no alerts.</div>`;
    return;
  }

  el.innerHTML = alerts.slice(0,8).map(a => `
    <div class="alert-item ${a.type} fade-in">
      <div class="text-xs font-semibold">${a.text}</div>
      <div class="text-[10px] text-[var(--text-muted)] mt-1">${new Date(a.ts).toLocaleDateString()}</div>
    </div>
  `).join('');
}

function setMetricRange(r){ metricRange = r; renderClientTabContent(); }
function setMetricFocus(m){ metricFocus = m; renderClientTabContent(); }
function setPlatformFocus(p){ platformFocus = p; renderClientTabContent(); }
function addMetricEntry(){
  const c = getClient();
  const date = document.getElementById("mDate").value;
  const platform = document.getElementById("mPlatform").value;
  const views = parseInt(document.getElementById("mViews").value)||0;
  const engagements = parseInt(document.getElementById("mEng").value)||0;
  const dms = parseInt(document.getElementById("mDms").value)||0;
  const metricTs = date ? parseISODateLocal(date).getTime() : Date.now();
  state.metrics.push({ id: uid("M"), clientId: c.id, ts: Number.isFinite(metricTs) ? metricTs : Date.now(), platform, views, engagements, dms, author: currentUser.name });
  saveState();
  logActivity(`logged telemetry for "${c.name}"`);
  renderClientDetail();
  showToast("Telemetry Logged", `Appended data to ${platform} stream.`);
}
let chartInstance = null;
function groupMetrics(clientId, range){
  const rows = state.metrics.filter(m=>m.clientId===clientId && (platformFocus==='all'||m.platform===platformFocus)).sort((a,b)=>a.ts-b.ts);
  const buckets = {};
  rows.forEach(m=>{
    const d = new Date(m.ts);
    let key;
    if (range==="daily") key = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
    else if (range==="weekly"){ const onejan=new Date(d.getFullYear(),0,1); const week=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7); key = `W${week}`; }
    else key = d.toLocaleDateString(undefined, {month:'short', year:'numeric'});
    if (!buckets[key]) buckets[key] = { views:0, engagements:0, dms:0 };
    buckets[key].views += m.views; buckets[key].engagements += m.engagements; buckets[key].dms += m.dms;
  });
  return buckets;
}

function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportMetricsCSV(){
  const c = getClient();
  const rows = state.metrics
    .filter(m=>m.clientId===c.id && (platformFocus==='all'||m.platform===platformFocus))
    .sort((a,b)=>a.ts-b.ts);
  const header = ["Date","Platform","Traffic","Interactions","Leads"];
  const body = rows.map(m => [ new Date(m.ts).toISOString().slice(0,10), m.platform || "Other", m.views, m.engagements, m.dms ]);
  const safeName = c.name.replace(/[^a-z0-9]+/gi,"_");
  const platformLabel = platformFocus==='all' ? "Aggregate" : platformFocus;
  downloadCSV(`EDS_${safeName}_${platformLabel}_Data.csv`, [header, ...body]);
  showToast("Export Initiated", `Downloading data packet for ${c.name}.`);
}

function drawMetricsChart(){
  const canvas = document.getElementById("metricsChart");
  if (!canvas) return;
  const buckets = groupMetrics(currentClientId, metricRange);
  const labels = Object.keys(buckets);
  const data = {
    views: labels.map(l=>buckets[l].views),
    engagements: labels.map(l=>buckets[l].engagements),
    dms: labels.map(l=>buckets[l].dms)
  };
  
  Chart.defaults.color = 'rgba(143, 162, 184, 0.7)';
  Chart.defaults.font.family = "'Inter', sans-serif";
  
  if (chartInstance) chartInstance.destroy();
  const allDatasets = [
    { key:"views", label:"Traffic", data:data.views, borderColor:"#E3C776", backgroundColor:"rgba(227, 199, 118, 0.1)", tension:0.4, fill:true, pointBackgroundColor:"#E3C776", pointBorderColor:"#000", pointBorderWidth:2, pointRadius:4, pointHoverRadius:6 },
    { key:"engagements", label:"Interactions", data:data.engagements, borderColor:"#7fd8a6", backgroundColor:"rgba(127, 216, 166, 0.1)", tension:0.4, fill:true, pointBackgroundColor:"#7fd8a6", pointBorderColor:"#000", pointBorderWidth:2, pointRadius:4, pointHoverRadius:6 },
    { key:"dms", label:"Leads", data:data.dms, borderColor:"#8fb8e0", backgroundColor:"rgba(143, 184, 224, 0.1)", tension:0.4, fill:true, pointBackgroundColor:"#8fb8e0", pointBorderColor:"#000", pointBorderWidth:2, pointRadius:4, pointHoverRadius:6 },
  ];
  const datasets = metricFocus === "all" ? allDatasets : allDatasets.filter(d => d.key === metricFocus);
  
  chartInstance = new Chart(canvas, {
    type: "line",
    data: { labels, datasets },
    options: { 
      responsive:true, 
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins:{ 
        legend:{ position: 'top', align: 'end', labels:{ boxWidth: 8, usePointStyle: true, font: { weight: 'bold', size: 11 } } },
        tooltip: { backgroundColor: 'rgba(4, 25, 48, 0.9)', titleFont: { size: 13, family: "'JetBrains Mono', monospace" }, bodyFont: { size: 12 }, padding: 12, borderColor: 'rgba(227, 199, 118, 0.3)', borderWidth: 1 }
      },
      scales:{ 
        x:{ grid:{ color:"rgba(227, 199, 118, 0.05)", drawBorder: false } }, 
        y:{ grid:{ color:"rgba(227, 199, 118, 0.05)", drawBorder: false }, beginAtZero: true } 
      } 
    }
  });
}

function renderGoalsTab(c){

      </div>
    </div>
    <div class="flex flex-col gap-4">
      ${goals.map(g=>{
        // Calculate current progress from metrics in that month
        const month = g.month;
        const [y, m] = month.split('-').map(Number);
        const start = new Date(y, m-1, 1).getTime();
        const end = new Date(y, m, 0, 23, 59, 59).getTime();
        const metricsInMonth = state.metrics.filter(me=> me.clientId===c.id && me.ts>=start && me.ts<=end);
        const sum = (field) => metricsInMonth.reduce((a,b)=>a+(b[field]||0),0);
        const views = sum('views'), eng = sum('engagements'), dms = sum('dms');
        const pViews = g.views? Math.min((views/g.views)*100, 100) : 0;

              </div>`).join('')}

function addGoal(){
  const c = getClient();

  const engagements = parseInt(document.getElementById("goalEng").value)||0;

  logActivity(`set growth goal for "${c.name}" (${month})`);
  renderClientDetail();
}

function changeCalendarMonth(delta){
  calendarMonth += delta;
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  renderClientDetail();
}
function collectBillingFields(){
  const amountEl = document.getElementById("bAmount");
  const statusEl = document.getElementById("bStatus");
  const dueEl = document.getElementById("bDue");
  const methodEl = document.getElementById("bMethod");
  const notesEl = document.getElementById("bNotes");
  if (!amountEl || !statusEl) return null;
  const amount = parseFloat(amountEl.value);
  return {
    amount: Number.isFinite(amount) ? amount : NaN,
    status: statusEl.value || "Unpaid",
    dueDate: (dueEl?.value || "").trim(),
    method: (methodEl?.value || "").trim(),
    notes: (notesEl?.value || "").trim()
  };
}
function saveBilling(){
  const c = getClient();
  if (!c || !currentUser?.canViewBilling) return;
  const fields = collectBillingFields();
  if (!fields) {
    showToast("Ledger Error", "Open the Financials tab before committing a ledger entry.");
    return;
  }
  if (!Number.isFinite(fields.amount) || fields.amount < 0) {
    showToast("Input Error", "The outstanding balance must be zero or greater.");
    return;
  }
  if (fields.dueDate && Number.isNaN(parseISODateLocal(fields.dueDate).getTime())) {
    showToast("Input Error", "Please enter a valid settlement date.");
    return;
  }

  const rec = {
    clientId: c.id,
    amount: Number(fields.amount.toFixed(2)),
    status: fields.status,
    dueDate: fields.dueDate,
    method: fields.method,
    notes: fields.notes,
    updatedAt: Date.now(),
    updatedBy: currentUser.name
  };
  const existing = state.payments.find(x=>x.clientId===c.id);
  if (existing) Object.assign(existing, rec);
  else state.payments.push(rec);
  saveState();
  logActivity(`updated financial ledger for "${c.name}"`);
  renderClientDetail();
  showToast("Ledger Updated", `Financial record committed for ${c.name}.`);
}
function generateReceipt(){
  const c = getClient();
  if (!c || !currentUser?.canViewBilling) return;
  const live = collectBillingFields();
  const stored = state.payments.find(x=>x.clientId===c.id) || {};
  const p = { ...stored, ...(live || {}) };

    showToast("Invoice Error", "Enter a valid outstanding balance before generating the invoice.");
    return;

    .filter(x=>x.clientId===c.id)

          <div style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#888;margin-bottom:6px;">Details</div>

        </div>
      </div>
      ${p.notes ? `<div style="margin-top:28px;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#555;"><strong>Notes:</strong> ${escapeHtml(p.notes)}</div>` : ""}
      <div style="margin-top:36px;font-size:11px;color:#888;letter-spacing:.08em;">Prepared by ${escapeHtml(currentUser.name)} · Empire Digital Unity</div>
    </div>`;
  document.getElementById("receiptModal").classList.remove("hidden");
}
function closeReceipt(){
  document.getElementById("receiptModal").classList.add("hidden");
}
function addPaymentHistory(){
  const c = getClient();
  if (!c || !currentUser?.canViewBilling) return;
  const dateEl = document.getElementById("phDate");
  const amountEl = document.getElementById("phAmount");
  const methodEl = document.getElementById("phMethod");
  if (!dateEl || !amountEl) {
    showToast("Payment Error", "Open the Financials tab before recording a payment.");
    return;
  }
  const date = dateEl.value;
  const amount = parseFloat(amountEl.value);
  const method = (methodEl?.value || "").trim();
  if (!date || Number.isNaN(parseISODateLocal(date).getTime()) || !Number.isFinite(amount) || amount <= 0) {
    showToast("Input Error", "Please provide a valid payment date and a positive amount.");
    return;
  }
  const billing = state.payments.find(x=>x.clientId===c.id);
  if (billing && Number.isFinite(Number(billing.amount)) && Number(billing.amount) >= 0) {
    const balance = Number(billing.amount);
    if (amount > balance && balance > 0) {
      showToast("Payment Error", `Payment cannot exceed the current outstanding balance of $${money(balance)}.`);
      return;
    }
  }

  state.paymentHistory.push({
    id: uid("PH"),
    clientId: c.id,
    date,
    amount,
    method,
    recordedBy: currentUser.name,
    ts: Date.now()
  });
  // Keep the operational ledger and payment history consistent.
  if (billing && Number.isFinite(Number(billing.amount)) && Number(billing.amount) >= 0) {
    const newBalance = Math.max(0, Number(billing.amount) - amount);
    billing.amount = Number(newBalance.toFixed(2));
    billing.status = newBalance === 0 ? "Paid" : "Partial";
    billing.updatedAt = Date.now();
    billing.updatedBy = currentUser.name;
  }

  saveState();
  logActivity(`recorded $${money(amount)} payment for "${c.name}"`);
  renderClientDetail();
  showToast("Payment Logged", `$${money(amount)} recorded for ${c.name}.`);
}

// ---------------- TOAST ----------------
function showToast(title, msg){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-[var(--gold)]/20 flex items-center justify-center text-[var(--gold)]"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div><div><div class="text-sm font-bold gold-text tracking-wide">${title}</div><div class="text-xs text-[var(--text-main)] mt-0.5">${msg}</div></div></div>`;
  t.classList.remove("hidden");
  t.style.animation = 'none';
  t.offsetHeight;
  t.style.animation = null;
  setTimeout(()=>t.classList.add("hidden"), 4000);
}

renderNameTiles();
